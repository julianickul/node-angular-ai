#version: '3.8'

# Общая сеть для всех сервисов
networks:
  nnaai-network:
    driver: bridge

# Volume для сохранения данных MySQL
volumes:
  mysql-data:
    driver: local

services:
  # ============================================
  # 1. MySQL 8
  # ============================================
  db:
    image: mysql:8.0
    container_name: nnaai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-nnaai_db}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASS:-12345}
      MYSQL_TCP_PORT: ${DB_PORT:-3306}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - nnaai-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ============================================
  # 2. Node.js (NestJS) - Production + Development
  # ============================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ${BACKEND_TARGET:-development}  # development или production
    container_name: nnaai-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-user}
      DB_PASS: ${DB_PASS:-12345}
      DB_NAME: ${DB_NAME:-nnaai_db}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey123}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: ${BACKEND_PORT:-3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app/backend
      - ./shared-types:/app/shared-types
      - /app/backend/node_modules  # Анонимный volume для node_modules
      - /app/backend/dist
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nnaai-network
    command: ${BACKEND_CMD:-npm run start:dev}  # Для development или production

  # ============================================
  # 3. Angular - Development (ng serve)
  # ============================================
  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: nnaai-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_URL: ${API_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_DEV_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app/frontend
      - ./shared-types:/app/shared-types
      - /app/frontend/node_modules  # Анонимный volume для node_modules
      - /app/frontend/dist
    depends_on:
      - backend
    networks:
      - nnaai-network
    command: npm run start:docker

  # ============================================
  # 4. Angular - Production (Nginx)
  # ============================================
  frontend-prod:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    container_name: nnaai-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PROD_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - nnaai-network
    profiles:
      - production  # Запускается только с профилем production

  # ============================================
  # 5. phpMyAdmin
  # ============================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: ${DB_PORT:-3306}
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
      PMA_USER: ${DB_USER:-user}
      PMA_PASSWORD: ${DB_PASS:-12345}
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nnaai-network