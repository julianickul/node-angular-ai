version: '3.8'

services:
  test-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test_password
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306" # Отдельный порт для тестов

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=test
      - DB_HOST=test-db
      - DB_PORT=3306
      - DB_NAME=test_db
    depends_on:
      - test-db
    command: npm run test:e2e
