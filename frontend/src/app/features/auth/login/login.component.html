<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Добро пожаловать</mat-card-title>
      <mat-card-subtitle>Войдите в ваш аккаунт</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="your@email.com">
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Email является обязательным
          </mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Пожалуйста, введите корректный email
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" [type]="showPassword() ? 'text' : 'password'">
          <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()">
            <!-- <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon> -->
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Пароль является обязательным
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            Пароль должен быть не менее 6 символов
          </mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="error()">
          {{ error() }}
        </div>

        <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loginForm.invalid || isLoading()">
          <mat-spinner diameter="20" *ngIf="isLoading()"></mat-spinner>
          <span *ngIf="!isLoading()">Войти</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <p>Нет аккаунта? <a routerLink="/register">Зарегистрироваться</a></p>
    </mat-card-actions>
  </mat-card>
</div>
